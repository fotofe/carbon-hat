name: Build Carbon hat

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "art/**"]
  schedule:
    - cron: "20 5 * * *"   # every day, to pick up Fedora updates
  workflow_dispatch:        # "Run workflow" button on GitHub

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/carbon-hat

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Build image
        run: |
          podman build --pull=newer \
            --build-arg VERSION="$(cat VERSION)" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.title="Carbon hat" \
            --label org.opencontainers.image.version="$(cat VERSION)" \
            -t carbon-hat:build .

      - name: Push to GitHub Packages
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest 44 "$(cat VERSION)" "$(date -u +%Y%m%d)"; do
            podman push carbon-hat:build "docker://${IMAGE}:${tag}"
          done
