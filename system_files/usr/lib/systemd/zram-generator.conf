# Carbon hat: compressed swap that lives in RAM (zram).
# It is sized by how much RAM the PC has:
#    8 GB PC ->  8 GB zram (holds ~2-3x that once compressed, so no freezes)
#   16 GB PC ->  8 GB zram
#   32 GB PC -> 16 GB zram (half; it rarely needs more)
[zram0]
zram-size = min(max(min(ram, 8192), ram / 2), 16384)
compression-algorithm = zstd
swap-priority = 100
