# Carbon hat memory settings for zram (see zram-generator.conf).
# Swapped pages sit in compressed RAM, so reading one back is cheap:
# read one page at a time and start swapping early instead of freezing.
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# carbonhat-memory.service lowers this on PCs with lots of RAM.
vm.swappiness = 180
